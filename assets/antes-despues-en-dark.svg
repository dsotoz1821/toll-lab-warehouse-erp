<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect width="900" height="550" rx="14" fill="#1a1a19"/>
<text x="28" y="36" font-size="19" fill="#ffffff" font-weight="700" text-anchor="start">From paper to a system</text>
<text x="28" y="57" font-size="12.5" fill="#898781" font-weight="400" text-anchor="start">Inventory and spare-parts management for a toll-road electronics laboratory</text>
<rect x="28" y="78" width="395" height="444" rx="10" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/>
<rect x="29" y="79" width="393" height="34" rx="10" fill="#331a10"/>
<rect x="29" y="79" width="4" height="34" rx="2" fill="#d95926"/>
<text x="46" y="101" font-size="12" fill="#d95926" font-weight="700" text-anchor="start" letter-spacing="1.4">BEFORE</text>
<text x="407" y="101" font-size="11" fill="#898781" font-weight="400" text-anchor="end">until 2026</text>
<circle cx="48" cy="137" r="3.5" fill="#d95926"/>
<text x="62" y="142" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Paper forms, site by site</text>
<text x="62" y="164" font-size="12" fill="#898781" font-weight="400" text-anchor="start">Every warehouse kept its own printed set</text>
<circle cx="48" cy="193" r="3.5" fill="#d95926"/>
<text x="62" y="198" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">One spreadsheet per person responsible</text>
<text x="62" y="220" font-size="12" fill="#898781" font-weight="400" text-anchor="start">No common source; versions that quietly diverged</text>
<circle cx="48" cy="249" r="3.5" fill="#d95926"/>
<text x="62" y="254" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Counting and consolidation by hand</text>
<text x="62" y="276" font-size="12" fill="#898781" font-weight="400" text-anchor="start">Month-end depended on every file arriving</text>
<circle cx="48" cy="305" r="3.5" fill="#d95926"/>
<text x="62" y="310" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Units with no identity of their own</text>
<text x="62" y="332" font-size="12" fill="#898781" font-weight="400" text-anchor="start">A written row: no way to follow a serial between</text>
<text x="62" y="348" font-size="12" fill="#898781" font-weight="400" text-anchor="start">sites</text>
<circle cx="48" cy="377" r="3.5" fill="#d95926"/>
<text x="62" y="382" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Errors nobody could see</text>
<text x="62" y="404" font-size="12" fill="#898781" font-weight="400" text-anchor="start">A number typed wrong surfaced months later, if</text>
<text x="62" y="420" font-size="12" fill="#898781" font-weight="400" text-anchor="start">ever</text>
<circle cx="48" cy="449" r="3.5" fill="#d95926"/>
<text x="62" y="454" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">No trace of who changed what</text>
<text x="62" y="476" font-size="12" fill="#898781" font-weight="400" text-anchor="start">The correction overwrote the previous value and</text>
<text x="62" y="492" font-size="12" fill="#898781" font-weight="400" text-anchor="start">erased it</text>
<rect x="477" y="78" width="395" height="444" rx="10" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/>
<rect x="478" y="79" width="393" height="34" rx="10" fill="#0f2a20"/>
<rect x="478" y="79" width="4" height="34" rx="2" fill="#199e70"/>
<text x="495" y="101" font-size="12" fill="#199e70" font-weight="700" text-anchor="start" letter-spacing="1.4">AFTER</text>
<text x="856" y="101" font-size="11" fill="#898781" font-weight="400" text-anchor="end">in production</text>
<circle cx="497" cy="137" r="3.5" fill="#199e70"/>
<text x="511" y="142" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">A single database</text>
<text x="511" y="164" font-size="12" fill="#898781" font-weight="400" text-anchor="start">All 22 sites and the laboratory on one source</text>
<circle cx="497" cy="193" r="3.5" fill="#199e70"/>
<text x="511" y="198" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Traceability by serial number</text>
<text x="511" y="220" font-size="12" fill="#898781" font-weight="400" text-anchor="start">Where each unit is, in which lane, and since when</text>
<circle cx="497" cy="249" r="3.5" fill="#199e70"/>
<text x="511" y="254" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Automatic period close</text>
<text x="511" y="276" font-size="12" fill="#898781" font-weight="400" text-anchor="start">The month's photograph freezes and is never</text>
<text x="511" y="292" font-size="12" fill="#898781" font-weight="400" text-anchor="start">rewritten</text>
<circle cx="497" cy="321" r="3.5" fill="#199e70"/>
<text x="511" y="326" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">The movement triggers the recalculation</text>
<text x="511" y="348" font-size="12" fill="#898781" font-weight="400" text-anchor="start">Inbound, outbound and replacements reflect</text>
<text x="511" y="364" font-size="12" fill="#898781" font-weight="400" text-anchor="start">themselves</text>
<circle cx="497" cy="393" r="3.5" fill="#199e70"/>
<text x="511" y="398" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Reconciliation before the close</text>
<text x="511" y="420" font-size="12" fill="#898781" font-weight="400" text-anchor="start">Finds and repairs drift while there is still time</text>
<circle cx="497" cy="449" r="3.5" fill="#199e70"/>
<text x="511" y="454" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Nothing is deleted, it is counterposed</text>
<text x="511" y="476" font-size="12" fill="#898781" font-weight="400" text-anchor="start">Every cancellation leaves a reversal entry and a</text>
<text x="511" y="492" font-size="12" fill="#898781" font-weight="400" text-anchor="start">ledger</text>
<circle cx="450" cy="300" r="18" fill="#111110" stroke="#2c2c2a" stroke-width="1"/>
<path d="M 446 293 L 454 300 L 446 307" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
