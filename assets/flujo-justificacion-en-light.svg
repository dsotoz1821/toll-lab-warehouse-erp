<svg xmlns="http://www.w3.org/2000/svg" width="900" height="694" viewBox="0 0 900 694" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect width="900" height="694" rx="14" fill="#fcfcfb"/>
<text x="28" y="36" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start">The lifecycle of a field replacement</text>
<text x="28" y="57" font-size="12.5" fill="#898781" font-weight="400" text-anchor="start">Five steps and an emergency exit. On the right, the guarantee each step rests on.</text>
<line x1="42" y1="104" x2="42" y2="444" stroke="#2a78d6" stroke-width="2"/>
<circle cx="42" cy="104" r="14" fill="#2a78d6"/>
<text x="42" y="108.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="70" y="100" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start">The replacement is raised</text>
<text x="70" y="120" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">The technician picks the unit going out and the one</text>
<text x="70" y="137" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">coming in, the lane, and attaches photographic</text>
<text x="70" y="154" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">evidence.</text>
<rect x="552" y="88" width="320" height="52" rx="8" fill="#f4f3f0" stroke="#e1e0d9" stroke-width="1"/>
<text x="564" y="106" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">The unit is locked: nobody else can take</text>
<text x="564" y="121" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">it while this document is alive.</text>
<circle cx="42" cy="195" r="14" fill="#2a78d6"/>
<text x="42" y="199.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="70" y="191" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start">The site supervisor approves</text>
<text x="70" y="211" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">They only see and approve their own warehouse. Scope</text>
<text x="70" y="228" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">is resolved on the server, not in the template.</text>
<rect x="552" y="179" width="320" height="67" rx="8" fill="#f4f3f0" stroke="#e1e0d9" stroke-width="1"/>
<text x="564" y="197" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">A supervisor cannot touch another</text>
<text x="564" y="212" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">plaza's inventory, not even by typing</text>
<text x="564" y="227" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">the URL by hand.</text>
<circle cx="42" cy="278" r="14" fill="#2a78d6"/>
<text x="42" y="282.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="70" y="274" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start">Administration validates</text>
<text x="70" y="294" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">Final review. Here the document gets its definitive</text>
<text x="70" y="311" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">folio and becomes official.</text>
<rect x="552" y="262" width="320" height="67" rx="8" fill="#f4f3f0" stroke="#e1e0d9" stroke-width="1"/>
<text x="564" y="280" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">The folio is never released or reused: a</text>
<text x="564" y="295" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">gap in the series is explained, not</text>
<text x="564" y="310" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">covered up.</text>
<circle cx="42" cy="361" r="14" fill="#2a78d6"/>
<text x="42" y="365.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="70" y="357" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start">The previous state is photographed</text>
<text x="70" y="377" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">Before touching anything, each unit's status,</text>
<text x="70" y="394" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">warehouse, lane and notes are stored.</text>
<rect x="552" y="345" width="320" height="67" rx="8" fill="#f4f3f0" stroke="#e1e0d9" stroke-width="1"/>
<text x="564" y="363" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">It goes first, in the same transaction.</text>
<text x="564" y="378" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">Captured later, it would store the</text>
<text x="564" y="393" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">already-mutated state.</text>
<circle cx="42" cy="444" r="14" fill="#2a78d6"/>
<text x="42" y="448.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="70" y="440" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start">The inventory moves</text>
<text x="70" y="460" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">The incoming unit becomes installed in its lane; the</text>
<text x="70" y="477" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">outgoing one is written off. Both keep their</text>
<text x="70" y="494" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">history.</text>
<rect x="552" y="428" width="320" height="67" rx="8" fill="#f4f3f0" stroke="#e1e0d9" stroke-width="1"/>
<text x="564" y="446" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">The movement triggers the recalculation</text>
<text x="564" y="461" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">of that site's monthly report on its</text>
<text x="564" y="476" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">own.</text>
<rect x="28" y="523" width="844" height="143" rx="10" fill="#fdeee7" stroke="#eb6834" stroke-width="1"/>
<text x="46" y="547" font-size="14" fill="#eb6834" font-weight="700" text-anchor="start">If it was wrong: the cancellation</text>
<text x="46" y="569" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">The document is not deleted, it is counterposed. Each unit returns exactly</text>
<text x="46" y="586" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">to the state in its photograph, and a reversal entry is written with its</text>
<text x="46" y="603" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">reason, author and evidence.</text>
<text x="46" y="626" font-size="12" fill="#898781" font-weight="400" text-anchor="start">And if a later document already took that unit, the reversal stops and</text>
<text x="46" y="642" font-size="12" fill="#898781" font-weight="400" text-anchor="start">says in what order things must be undone.</text>
</svg>
