<svg xmlns="http://www.w3.org/2000/svg" width="900" height="582" viewBox="0 0 900 582" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect width="900" height="582" rx="14" fill="#1a1a19"/>
<text x="28" y="36" font-size="19" fill="#ffffff" font-weight="700" text-anchor="start">Del papel al sistema</text>
<text x="28" y="57" font-size="12.5" fill="#898781" font-weight="400" text-anchor="start">Gestión de inventario y refacciones de un laboratorio de electrónica de peaje</text>
<rect x="28" y="78" width="395" height="476" rx="10" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/>
<rect x="29" y="79" width="393" height="34" rx="10" fill="#331a10"/>
<rect x="29" y="79" width="4" height="34" rx="2" fill="#d95926"/>
<text x="46" y="101" font-size="12" fill="#d95926" font-weight="700" text-anchor="start" letter-spacing="1.4">ANTES</text>
<text x="407" y="101" font-size="11" fill="#898781" font-weight="400" text-anchor="end">hasta 2026</text>
<circle cx="48" cy="137" r="3.5" fill="#d95926"/>
<text x="62" y="142" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Formato en papel, plaza por plaza</text>
<text x="62" y="164" font-size="12" fill="#898781" font-weight="400" text-anchor="start">Cada subalmacén con su propio juego impreso</text>
<circle cx="48" cy="193" r="3.5" fill="#d95926"/>
<text x="62" y="198" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Un Excel por responsable</text>
<text x="62" y="220" font-size="12" fill="#898781" font-weight="400" text-anchor="start">Sin origen común; versiones que divergían en</text>
<text x="62" y="236" font-size="12" fill="#898781" font-weight="400" text-anchor="start">silencio</text>
<circle cx="48" cy="265" r="3.5" fill="#d95926"/>
<text x="62" y="270" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Conteo y consolidación a mano</text>
<text x="62" y="292" font-size="12" fill="#898781" font-weight="400" text-anchor="start">El cierre del mes dependía de que llegaran los</text>
<text x="62" y="308" font-size="12" fill="#898781" font-weight="400" text-anchor="start">archivos</text>
<circle cx="48" cy="337" r="3.5" fill="#d95926"/>
<text x="62" y="342" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Equipos sin identidad propia</text>
<text x="62" y="364" font-size="12" fill="#898781" font-weight="400" text-anchor="start">Una fila escrita: imposible seguir una serie entre</text>
<text x="62" y="380" font-size="12" fill="#898781" font-weight="400" text-anchor="start">plazas</text>
<circle cx="48" cy="409" r="3.5" fill="#d95926"/>
<text x="62" y="414" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Errores que nadie veía</text>
<text x="62" y="436" font-size="12" fill="#898781" font-weight="400" text-anchor="start">Una cifra mal capturada se descubría meses</text>
<text x="62" y="452" font-size="12" fill="#898781" font-weight="400" text-anchor="start">después, o nunca</text>
<circle cx="48" cy="481" r="3.5" fill="#d95926"/>
<text x="62" y="486" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Sin rastro de quién cambió qué</text>
<text x="62" y="508" font-size="12" fill="#898781" font-weight="400" text-anchor="start">La corrección sobrescribía el dato anterior y lo</text>
<text x="62" y="524" font-size="12" fill="#898781" font-weight="400" text-anchor="start">borraba</text>
<rect x="477" y="78" width="395" height="476" rx="10" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/>
<rect x="478" y="79" width="393" height="34" rx="10" fill="#0f2a20"/>
<rect x="478" y="79" width="4" height="34" rx="2" fill="#199e70"/>
<text x="495" y="101" font-size="12" fill="#199e70" font-weight="700" text-anchor="start" letter-spacing="1.4">DESPUÉS</text>
<text x="856" y="101" font-size="11" fill="#898781" font-weight="400" text-anchor="end">en producción</text>
<circle cx="497" cy="137" r="3.5" fill="#199e70"/>
<text x="511" y="142" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Una sola base de datos</text>
<text x="511" y="164" font-size="12" fill="#898781" font-weight="400" text-anchor="start">Las 22 plazas y el laboratorio sobre el mismo</text>
<text x="511" y="180" font-size="12" fill="#898781" font-weight="400" text-anchor="start">origen</text>
<circle cx="497" cy="209" r="3.5" fill="#199e70"/>
<text x="511" y="214" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Trazabilidad por número de serie</text>
<text x="511" y="236" font-size="12" fill="#898781" font-weight="400" text-anchor="start">Dónde está cada equipo, en qué carril y desde</text>
<text x="511" y="252" font-size="12" fill="#898781" font-weight="400" text-anchor="start">cuándo</text>
<circle cx="497" cy="281" r="3.5" fill="#199e70"/>
<text x="511" y="286" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Cierre de periodo automático</text>
<text x="511" y="308" font-size="12" fill="#898781" font-weight="400" text-anchor="start">La foto del mes se congela y ya no se reescribe</text>
<circle cx="497" cy="337" r="3.5" fill="#199e70"/>
<text x="511" y="342" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">El movimiento dispara el recálculo</text>
<text x="511" y="364" font-size="12" fill="#898781" font-weight="400" text-anchor="start">Entradas, salidas y justificaciones se reflejan</text>
<text x="511" y="380" font-size="12" fill="#898781" font-weight="400" text-anchor="start">solas</text>
<circle cx="497" cy="409" r="3.5" fill="#199e70"/>
<text x="511" y="414" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Conciliación antes de cerrar</text>
<text x="511" y="436" font-size="12" fill="#898781" font-weight="400" text-anchor="start">Detecta y repara desviaciones mientras todavía se</text>
<text x="511" y="452" font-size="12" fill="#898781" font-weight="400" text-anchor="start">puede</text>
<circle cx="497" cy="481" r="3.5" fill="#199e70"/>
<text x="511" y="486" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Nada se borra: se contrapone</text>
<text x="511" y="508" font-size="12" fill="#898781" font-weight="400" text-anchor="start">Cada cancelación deja asiento de reversa y</text>
<text x="511" y="524" font-size="12" fill="#898781" font-weight="400" text-anchor="start">bitácora</text>
<circle cx="450" cy="316" r="18" fill="#111110" stroke="#2c2c2a" stroke-width="1"/>
<path d="M 446 309 L 454 316 L 446 323" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
