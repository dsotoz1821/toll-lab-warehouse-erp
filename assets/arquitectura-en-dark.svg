<svg xmlns="http://www.w3.org/2000/svg" width="900" height="668" viewBox="0 0 900 668" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect width="900" height="668" rx="14" fill="#1a1a19"/>
<text x="28" y="36" font-size="19" fill="#ffffff" font-weight="700" text-anchor="start">Architecture</text>
<text x="28" y="57" font-size="12.5" fill="#898781" font-weight="400" text-anchor="start">Four layers. The rules that must never be lost live in the bottom one.</text>
<rect x="28" y="78" width="844" height="108" rx="10" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/>
<rect x="29" y="88" width="4" height="88" rx="2" fill="#9085e9"/>
<text x="48" y="105" font-size="12" fill="#9085e9" font-weight="700" text-anchor="start" letter-spacing="1.4">WHO USES IT</text>
<text x="856" y="105" font-size="11" fill="#898781" font-weight="400" text-anchor="end">scope by role and by site</text>
<text x="48" y="136" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Field technician</text>
<text x="48" y="153" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Raises the movement from a tablet</text>
<text x="317" y="136" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Site supervisor</text>
<text x="317" y="153" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Approves their own plaza, and only theirs</text>
<text x="586" y="136" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Management and admin</text>
<text x="586" y="153" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Validates, closes the period, audits</text>
<line x1="68" y1="186" x2="68" y2="212" stroke="#383835" stroke-width="1.5" stroke-dasharray="3 4"/><text x="80" y="203" font-size="11" fill="#898781" font-weight="400" text-anchor="start">HTTPS · session scoped to the user's warehouse</text>
<rect x="28" y="212" width="844" height="160" rx="10" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/>
<rect x="29" y="222" width="4" height="140" rx="2" fill="#3987e5"/>
<text x="48" y="239" font-size="12" fill="#3987e5" font-weight="700" text-anchor="start" letter-spacing="1.4">APPLICATION</text>
<text x="856" y="239" font-size="11" fill="#898781" font-weight="400" text-anchor="end">Django · Python</text>
<text x="48" y="270" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Catalogue</text>
<text x="48" y="287" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Concepts, costs,</text>
<text x="48" y="301" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">classification</text>
<text x="250" y="270" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Warehouse</text>
<text x="250" y="287" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Inbound, outbound, supply</text>
<text x="452" y="270" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Replacements</text>
<text x="452" y="287" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Field equipment swaps</text>
<text x="654" y="270" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Min / max report</text>
<text x="654" y="287" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Frozen monthly form</text>
<text x="48" y="322" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Reports</text>
<text x="48" y="339" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Official forms as PDF and</text>
<text x="48" y="353" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Excel</text>
<text x="250" y="322" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Notifications</text>
<text x="250" y="339" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Alerts by role and owner</text>
<text x="452" y="322" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Audit</text>
<text x="452" y="339" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Who changed what, and when</text>
<text x="654" y="322" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Mobile API</text>
<text x="654" y="339" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Serial lookup from a phone</text>
<line x1="68" y1="372" x2="68" y2="398" stroke="#383835" stroke-width="1.5" stroke-dasharray="3 4"/><text x="80" y="389" font-size="11" fill="#898781" font-weight="400" text-anchor="start">asynchronous tasks</text>
<rect x="28" y="398" width="844" height="108" rx="10" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/>
<rect x="29" y="408" width="4" height="88" rx="2" fill="#d95926"/>
<text x="48" y="425" font-size="12" fill="#d95926" font-weight="700" text-anchor="start" letter-spacing="1.4">BACKGROUND JOBS</text>
<text x="856" y="425" font-size="11" fill="#898781" font-weight="400" text-anchor="end">Celery · Redis</text>
<text x="48" y="456" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Period close</text>
<text x="48" y="473" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Freezes the month's photograph</text>
<text x="250" y="456" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Nightly reconciliation</text>
<text x="250" y="473" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Repairs before the close</text>
<text x="452" y="456" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Recalculation queue</text>
<text x="452" y="473" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Drains what the trigger marked</text>
<text x="654" y="456" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">PDF and email</text>
<text x="654" y="473" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Off the user's critical path</text>
<line x1="68" y1="506" x2="68" y2="532" stroke="#383835" stroke-width="1.5" stroke-dasharray="3 4"/><text x="80" y="523" font-size="11" fill="#898781" font-weight="400" text-anchor="start">the last line of defence</text>
<rect x="28" y="532" width="844" height="108" rx="10" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/>
<rect x="29" y="542" width="4" height="88" rx="2" fill="#199e70"/>
<text x="48" y="559" font-size="12" fill="#199e70" font-weight="700" text-anchor="start" letter-spacing="1.4">DATA</text>
<text x="856" y="559" font-size="11" fill="#898781" font-weight="400" text-anchor="end">PostgreSQL</text>
<text x="48" y="590" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Row-level history</text>
<text x="48" y="607" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Every change kept, with its reason</text>
<text x="317" y="590" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Integrity triggers</text>
<text x="317" y="607" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">What the application cannot bypass</text>
<text x="586" y="590" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Frozen periods</text>
<text x="586" y="607" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">A closed month is never rewritten</text>
</svg>
