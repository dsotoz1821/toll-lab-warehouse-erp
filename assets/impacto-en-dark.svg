<text x="688" y="277" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">no longer kept on paper</text>
<text x="28" y="344" font-size="14" fill="#ffffff" font-weight="700" text-anchor="start">What changed in the operation</text>
<rect x="28" y="366" width="844" height="118" rx="10" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/>
<text x="46" y="392" font-size="13" fill="#ffffff" font-weight="600" text-anchor="start">Monthly close of the report</text>
<text x="46" y="428" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">before</text>
