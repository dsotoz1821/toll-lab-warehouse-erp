<svg xmlns="http://www.w3.org/2000/svg" width="900" height="598" viewBox="0 0 900 598" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect width="900" height="598" rx="14" fill="#1a1a19"/>
<text x="28" y="36" font-size="19" fill="#ffffff" font-weight="700" text-anchor="start">Impact</text>
<text x="28" y="57" font-size="12.5" fill="#898781" font-weight="400" text-anchor="start">In production since April 2026.</text>
<rect x="28" y="80" width="844" height="96" rx="10" fill="#0f2a20" stroke="#199e70" stroke-width="1"/>
<text x="54" y="138" font-size="44" fill="#199e70" font-weight="700" text-anchor="start">−80%</text>
<text x="54" y="162" font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">in audit findings</text>
<text x="328" y="118" font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="start">The only number on this page I do not report myself. It</text>
<text x="328" y="134" font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="start">comes from having control and traceability of the whole</text>
<text x="328" y="150" font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="start">fleet, unit by unit.</text>
<rect x="28" y="190" width="200" height="124" rx="10" fill="#111110" stroke="#2c2c2a" stroke-width="1"/>
<text x="46" y="238" font-size="30" fill="#3987e5" font-weight="700" text-anchor="start">22</text>
<text x="46" y="258" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="start">sites and warehouses</text>
<text x="46" y="277" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">on a single database</text>
<rect x="242" y="190" width="200" height="124" rx="10" fill="#111110" stroke="#2c2c2a" stroke-width="1"/>
<text x="260" y="238" font-size="30" fill="#3987e5" font-weight="700" text-anchor="start">50k+</text>
<text x="260" y="258" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="start">units with a serial</text>
<text x="260" y="275" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="start">number</text>
<text x="260" y="294" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">traceable one by one</text>
<rect x="456" y="190" width="200" height="124" rx="10" fill="#111110" stroke="#2c2c2a" stroke-width="1"/>
<text x="474" y="238" font-size="30" fill="#3987e5" font-weight="700" text-anchor="start">150+</text>
<text x="474" y="258" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="start">active users</text>
<text x="474" y="277" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">of more than 250, across 5</text>
<text x="474" y="291" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">roles</text>
<rect x="670" y="190" width="200" height="124" rx="10" fill="#111110" stroke="#2c2c2a" stroke-width="1"/>
<text x="688" y="238" font-size="30" fill="#3987e5" font-weight="700" text-anchor="start">6</text>
