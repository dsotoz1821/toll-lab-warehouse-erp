<svg xmlns="http://www.w3.org/2000/svg" width="900" height="686" viewBox="0 0 900 686" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect width="900" height="686" rx="14" fill="#1a1a19"/>
<text x="28" y="36" font-size="19" fill="#ffffff" font-weight="700" text-anchor="start">El ciclo de vida de un reemplazo en campo</text>
<text x="28" y="57" font-size="12.5" fill="#898781" font-weight="400" text-anchor="start">Cinco pasos y una salida de emergencia. A la derecha, la garantía que sostiene cada paso.</text>
<line x1="42" y1="104" x2="42" y2="444" stroke="#3987e5" stroke-width="2"/>
<circle cx="42" cy="104" r="14" fill="#3987e5"/>
<text x="42" y="108.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="70" y="100" font-size="14" fill="#ffffff" font-weight="700" text-anchor="start">Se levanta el reemplazo</text>
<text x="70" y="120" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">El técnico elige el equipo que sale y el que entra,</text>
<text x="70" y="137" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">el carril y adjunta la evidencia fotográfica.</text>
<rect x="552" y="88" width="320" height="67" rx="8" fill="#111110" stroke="#2c2c2a" stroke-width="1"/>
<text x="564" y="106" font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="start">El equipo queda bloqueado: nadie más</text>
<text x="564" y="121" font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="start">puede tomarlo mientras este documento</text>
<text x="564" y="136" font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="start">viva.</text>
<circle cx="42" cy="187" r="14" fill="#3987e5"/>
<text x="42" y="191.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="70" y="183" font-size="14" fill="#ffffff" font-weight="700" text-anchor="start">Aprueba el supervisor</text>
<text x="70" y="203" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Solo ve y aprueba lo de su propio subalmacén. El</text>
<text x="70" y="220" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">alcance se resuelve en el servidor, no en la</text>
<text x="70" y="237" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">pantalla.</text>
<rect x="552" y="171" width="320" height="67" rx="8" fill="#111110" stroke="#2c2c2a" stroke-width="1"/>
<text x="564" y="189" font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Un supervisor no puede tocar inventario</text>
<text x="564" y="204" font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="start">de otra plaza, ni escribiendo la URL a</text>
<text x="564" y="219" font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="start">mano.</text>
<circle cx="42" cy="278" r="14" fill="#3987e5"/>
<text x="42" y="282.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="70" y="274" font-size="14" fill="#ffffff" font-weight="700" text-anchor="start">Valida la administración</text>
<text x="70" y="294" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Revisión final. Aquí el documento recibe su folio</text>
<text x="70" y="311" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">definitivo y se vuelve oficial.</text>
<rect x="552" y="262" width="320" height="67" rx="8" fill="#111110" stroke="#2c2c2a" stroke-width="1"/>
<text x="564" y="280" font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="start">El folio nunca se libera ni se</text>
<text x="564" y="295" font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="start">reutiliza: un hueco en la serie se</text>
<text x="564" y="310" font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="start">explica, no se tapa.</text>
<circle cx="42" cy="361" r="14" fill="#3987e5"/>
<text x="42" y="365.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="70" y="357" font-size="14" fill="#ffffff" font-weight="700" text-anchor="start">Se fotografía el estado previo</text>
<text x="70" y="377" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Antes de tocar nada, se guarda cómo estaba cada</text>
<text x="70" y="394" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">equipo: estatus, almacén, carril y observaciones.</text>
<rect x="552" y="345" width="320" height="67" rx="8" fill="#111110" stroke="#2c2c2a" stroke-width="1"/>
<text x="564" y="363" font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Va primero y en la misma transacción. Si</text>
<text x="564" y="378" font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="start">se capturara después, guardaría el</text>
<text x="564" y="393" font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="start">estado ya mutado.</text>
<circle cx="42" cy="444" r="14" fill="#3987e5"/>
<text x="42" y="448.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="70" y="440" font-size="14" fill="#ffffff" font-weight="700" text-anchor="start">Se mueve el inventario</text>
<text x="70" y="460" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">El equipo nuevo queda instalado en su carril; el</text>
<text x="70" y="477" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">retirado, dado de baja. Ambos con su historial.</text>
<rect x="552" y="428" width="320" height="67" rx="8" fill="#111110" stroke="#2c2c2a" stroke-width="1"/>
<text x="564" y="446" font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="start">El movimiento dispara por sí solo el</text>
<text x="564" y="461" font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="start">recálculo del formato mensual de esa</text>
<text x="564" y="476" font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="start">plaza.</text>
<rect x="28" y="515" width="844" height="143" rx="10" fill="#331a10" stroke="#d95926" stroke-width="1"/>
<text x="46" y="539" font-size="14" fill="#d95926" font-weight="700" text-anchor="start">Si hubo un error: la cancelación</text>
<text x="46" y="561" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">El documento no se borra: se contrapone. Cada equipo vuelve exactamente al</text>
<text x="46" y="578" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">estado de su fotografía y queda el asiento de reversa, con motivo, autor y</text>
<text x="46" y="595" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">evidencia.</text>
<text x="46" y="618" font-size="12" fill="#898781" font-weight="400" text-anchor="start">Y si otro documento posterior ya tomó ese equipo, la reversión se detiene</text>
<text x="46" y="634" font-size="12" fill="#898781" font-weight="400" text-anchor="start">y dice en qué orden hay que deshacer.</text>
</svg>
