<svg xmlns="http://www.w3.org/2000/svg" width="900" height="598" viewBox="0 0 900 598" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect width="900" height="598" rx="14" fill="#fcfcfb"/>
<text x="28" y="36" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start">Impacto</text>
<text x="28" y="57" font-size="12.5" fill="#898781" font-weight="400" text-anchor="start">En producción desde abril de 2026.</text>
<rect x="28" y="80" width="844" height="96" rx="10" fill="#e4f6ef" stroke="#1baf7a" stroke-width="1"/>
<text x="54" y="138" font-size="44" fill="#1baf7a" font-weight="700" text-anchor="start">−80%</text>
<text x="54" y="162" font-size="13.5" fill="#0b0b0b" font-weight="600" text-anchor="start">en observaciones de auditoría</text>
<text x="328" y="118" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">El único número de esta página que no lo reporto yo. Viene</text>
<text x="328" y="134" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">de tener control y trazabilidad del equipo completo, pieza</text>
<text x="328" y="150" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">por pieza.</text>
<rect x="28" y="190" width="200" height="124" rx="10" fill="#f4f3f0" stroke="#e1e0d9" stroke-width="1"/>
<text x="46" y="238" font-size="30" fill="#2a78d6" font-weight="700" text-anchor="start">22</text>
<text x="46" y="258" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">plazas y subalmacenes</text>
<text x="46" y="277" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">sobre una sola base</text>
<rect x="242" y="190" width="200" height="124" rx="10" fill="#f4f3f0" stroke="#e1e0d9" stroke-width="1"/>
<text x="260" y="238" font-size="30" fill="#2a78d6" font-weight="700" text-anchor="start">+50 mil</text>
<text x="260" y="258" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">equipos con número de</text>
<text x="260" y="275" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">serie</text>
<text x="260" y="294" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">rastreables uno por uno</text>
<rect x="456" y="190" width="200" height="124" rx="10" fill="#f4f3f0" stroke="#e1e0d9" stroke-width="1"/>
<text x="474" y="238" font-size="30" fill="#2a78d6" font-weight="700" text-anchor="start">+150</text>
<text x="474" y="258" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">usuarios activos</text>
<text x="474" y="277" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">de más de 250, en 5 roles</text>
<rect x="670" y="190" width="200" height="124" rx="10" fill="#f4f3f0" stroke="#e1e0d9" stroke-width="1"/>
<text x="688" y="238" font-size="30" fill="#2a78d6" font-weight="700" text-anchor="start">6</text>
<text x="688" y="258" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">formatos oficiales</text>
<text x="688" y="277" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">que dejaron de llevarse en</text>
<text x="688" y="291" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">papel</text>
<text x="28" y="344" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start">Lo que cambió en la operación</text>
