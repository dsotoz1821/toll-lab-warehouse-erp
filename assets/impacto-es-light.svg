<text x="46" y="392" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">Cierre mensual del formato</text>
<text x="46" y="428" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">antes</text>
<rect x="136" y="414" width="576" height="18" rx="4" fill="#eb6834"/>
<text x="724" y="428" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">7 días</text>
<text x="46" y="462" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">ahora</text>
<rect x="136" y="448" width="82" height="18" rx="4" fill="#1baf7a"/>
<text x="230" y="462" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">El mismo día</text>
